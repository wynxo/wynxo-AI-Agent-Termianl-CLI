[project]
name = "wynxo"
version = "0.1.0"
description = "A terminal AI coding agent for local Ollama models, with real effort levels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
wynxo = "wynxo.bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wynxo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
