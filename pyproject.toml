[project]
name = "wynxo"
version = "0.1.0"
description = "A terminal AI coding agent for local Ollama models, with real effort levels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.9", "pytest-cov>=5.0"]

[project.scripts]
wynxo = "wynxo.bootstrap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wynxo*"]

[tool.setuptools.package-data]
# The ASCII art is data, not code, so a wheel built without this ships
# without it: `logo.read()` swallows the resulting OSError, and the banner
# and the pet silently disappear for anyone who did not install from a
# git clone. Editable installs read straight from the tree, which is why
# nothing noticed.
wynxo = ["art/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# The F set (pyflakes) is the class of bug this project keeps tripping on:
# undefined names, unused imports, dangling __all__ entries, f-strings
# without placeholders. Everything beyond it is style, which the tests and
# review already cover; turning the rest on would be a migration, not a
# guard.
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
